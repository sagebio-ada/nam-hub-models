name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow running the checks by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  # A new push to a branch cancels any run still in flight for it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint schemas
        run: uv run just lint

      - name: Lint Python
        run: uv run just lint-py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --group deploy

      - name: Run tests
        run: uv run just test
