id: https://namhub.synapse.org/portal_schemas/enums
name: namhub-enums
description: Shared enumeration definitions for NAMHub portal schemas.

prefixes:
  linkml: https://w3id.org/linkml/
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  MESH: http://id.nlm.nih.gov/mesh/
  EFO: http://www.ebi.ac.uk/efo/EFO_
  MAMO: http://identifiers.org/mamo/MAMO_
  EDAM: http://edamontology.org/
  GENEPIO: http://purl.obolibrary.org/obo/GENEPIO_
  OBI: http://purl.obolibrary.org/obo/OBI_
  CHMO: http://purl.obolibrary.org/obo/CHMO_
  MI: http://purl.obolibrary.org/obo/MI_
  MMO: http://purl.obolibrary.org/obo/MMO_
  GO: http://purl.obolibrary.org/obo/GO_
  BAO: http://purl.obolibrary.org/obo/BAO_
  ENM: http://purl.enanomapper.org/onto/ENM_
  COB: http://purl.obolibrary.org/obo/COB_
  SO: http://purl.obolibrary.org/obo/SO_
  IAO: http://purl.obolibrary.org/obo/IAO_

default_prefix: https://namhub.synapse.org/portal_schemas/enums/

imports:
  - linkml:types

enums:

  # ── Landscape vocabulary ─────────────────────────────────────────────────────

  AssayEnum:
    description: Experimental method used to generate files in the dataset.
    permissible_values:
      "ATAC-seq":
        meaning: EFO:0007045
        description: "A method based on direct in vitro transposition of sequencing adaptors into native chromatin, used for rapid, sensitive integrative epigenomic analysis of open chromatin."
        annotations: {description_source: ontology}
      "CAPP-seq":
        meaning: EFO:0008672
        description: "Cancer personalized profiling by deep sequencing (CAPP-Seq), a method for ultrasensitive detection of circulating tumor DNA."
        annotations: {description_source: ontology}
      "CUT&RUN":
        meaning: EFO:0009973
        description: "Cleavage under targets and release using nuclease, a method for assessing DNA-protein interactions by antibody-targeted chromatin cleavage."
        annotations: {description_source: ontology}
      "ChIP-seq":
        meaning: EFO:0002692
        description: "An assay in which chromatin immunoprecipitation with high-throughput sequencing is used to identify the cistrome of DNA-associated proteins."
        annotations: {description_source: ontology}
      "ERR bisulfite sequencing":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "A bisulfite sequencing variant for detecting DNA methylation using an enzymatic or error-reduced conversion protocol."
      "HI-C":
        meaning: EFO:0007693
        description: "A method for analysing the 3-dimensional organisation and interaction of chromatin, belonging to the Chromosome Conformation Capture family of techniques."
        annotations: {description_source: ontology}
      "ISO-seq":
        meaning: OBI:0002575
        description: "A method for sequencing isoforms by enriching a cDNA library for full-length reads spanning entire transcript isoforms."
        annotations: {description_source: ontology}
      "NOMe-seq":
        meaning: NCIT:C106053
        description: "A DNA sequencing technique that determines DNA methylation status while also distinguishing non-nucleosomal from nucleosome-associated DNA."
        annotations: {description_source: ontology}
      "RNA array":
        meaning: EFO:0002768
        description: "An assay in which the transcriptome of a biological sample is analysed using array technology."
        annotations: {description_source: ontology}
      "RNA-seq":
        meaning: EFO:0002770
        description: "A method used to assess the transcriptome of a biological sample using a high-throughput sequencing platform."
        annotations: {description_source: ontology}
      "SNP array":
        meaning: EFO:0002703
        description: "An oligonucleotide DNA microarray used to detect single-nucleotide polymorphisms in DNA samples."
        annotations: {description_source: ontology}
      "SaferSeqS":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "An error-corrected duplex sequencing method (Safer Sequencing System) designed to detect rare somatic mutations with very low false-positive rates."
      "Sanger sequencing":
        meaning: NCIT:C19641
        description: "A DNA sequencing technique using chain-terminating dideoxynucleotides combined with regular nucleotides, with fragments separated and read by size."
        annotations: {description_source: ontology}
      "T cell receptor repertoire sequencing":
        meaning: NCIT:C189102
        description: "A sequencing analysis used to identify T-cell receptors in a biological sample, enabling identification of disease or treatment-response biomarkers."
        annotations: {description_source: ontology}
      "bisulfite sequencing":
        meaning: NCIT:C106054
        description: "A DNA sequencing technique that differentiates cytosine from 5-methylcytosine in a DNA sample via bisulfite conversion."
        annotations: {description_source: ontology}
      "jumping library":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "A mate-pair sequencing library construction method that captures long-range genomic linkage by circularizing large DNA fragments before sequencing."
      "lncRNA-seq":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "RNA sequencing targeted at profiling long non-coding RNA (lncRNA) transcripts."
      "methylation array":
        meaning: NCIT:C165222
        description: "The use of a high-throughput microarray to determine which CpG islands or promoter sequences in a specimen are methylated."
        annotations: {description_source: ontology}
      "miRNA array":
        meaning: EFO:0000753
        description: "An assay in which a microRNA array is used to analyse the microRNA component of the transcriptome."
        annotations: {description_source: ontology}
      "miRNA-seq":
        meaning: NCIT:C156057
        description: "A high-throughput DNA sequencing-based procedure that identifies and quantifies microRNA sequences present in a biological sample."
        annotations: {description_source: ontology}
      "next-generation sequencing":
        meaning: NCIT:C101293
        description: "Technologies that facilitate the rapid determination of the nucleotide sequence of large numbers of strands or segments of DNA or RNA."
        annotations: {description_source: ontology}
      "next generation targeted sequencing":
        meaning: NCIT:C130177
        description: "A technique that determines the nucleotide sequence of a pre-specified region of DNA or RNA using primers specific to that region."
        annotations: {description_source: ontology}
      "oxBS-seq":
        meaning: EFO:0008840
        description: "Oxidative bisulfite sequencing, used to map 5-methylcytosine and 5-hydroxymethylcytosine separately."
        annotations: {description_source: ontology}
      "ribo-seq":
        meaning: EFO:0008891
        description: "Ribosome profiling using specialized mRNA sequencing to determine which mRNAs are being actively translated at a given moment."
        annotations: {description_source: ontology}
      "scCGI-seq":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "A single-cell sequencing method for profiling CpG island methylation status at single-cell resolution."
      "single cell ATAC-seq":
        meaning: NCIT:C179458
        description: "A technique in which DNA isolated from single-cell samples is subjected to ATAC-seq to isolate and sequence regions rich in open chromatin."
        annotations: {description_source: ontology}
      "single-cell RNA-seq":
        meaning: EFO:0008913
        description: "A protocol providing expression profiles of single cells via isolation and barcoding of single cells and their RNA, followed by reverse transcription, amplification, and sequencing."
        annotations: {description_source: ontology}
      "single-nucleus RNA-seq":
        meaning: EFO:0009809
        description: "Sequencing that examines RNA from individual nuclei, enabling RNA-seq profiling of cell types vulnerable to tissue-dissociation artifacts."
        annotations: {description_source: ontology}
      "spatial transcriptomics":
        meaning: EFO:0008994
        description: "An assay allowing visualization and quantitative analysis of the transcriptome with spatial resolution in individual tissue sections."
        annotations: {description_source: ontology}
      "targeted exome sequencing":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "Sequencing of a targeted subset of exonic regions selected via a custom gene panel, rather than the entire exome."
      "whole exome sequencing":
        meaning: NCIT:C101295
        description: "A procedure that determines the DNA sequence for all of the exons in an individual."
        annotations: {description_source: ontology}
      "whole genome sequencing":
        meaning: NCIT:C101294
        description: "A procedure that determines the DNA sequence for nearly the entire genome of an individual."
        annotations: {description_source: ontology}
      "3D confocal imaging":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "Three-dimensional imaging generated by combining a series of optical sections acquired using confocal microscopy."
      "3D electron microscopy":
        annotations: {ontology_verdict: partial, description_source: ontology}
        meaning: OBI:0003118
        description: "A 3D molecular structure determination assay that uses electron microscopy imaging."
      "3D imaging":
        meaning: NCIT:C18485
        description: "A technique that combines multiple scans into a manipulable 3D model to visualize structures in detail."
        annotations: {description_source: ontology}
      "CODEX":
        meaning: NCIT:C181931
        description: "A highly multiplexed cytometric imaging approach that iteratively visualizes antibody binding events using DNA barcodes and in situ polymerization-based indexing."
        annotations: {description_source: ontology}
      "DNA optical mapping":
        meaning: NCIT:C116162
        description: "A technique for constructing an ordered, high-resolution restriction-enzyme map of a genome from a single stained DNA molecule imaged by optical microscopy."
        annotations: {description_source: ontology}
      "Fluorescence In Situ Hybridization":
        meaning: NCIT:C17563
        description: "A physical mapping approach using fluorescent tags to detect probe hybridization within chromosomes, used to identify chromosomal abnormalities and for gene mapping."
        annotations: {description_source: ontology}
      "Magnetization-Prepared Rapid Gradient Echo MRI":
        meaning: NCIT:C118462
        description: "An MRI modality combining magnetization-prepared imaging with rapid 3D gradient echo acquisition for high tissue contrast and spatial resolution in a short scan time."
        annotations: {description_source: ontology}
      "SUSHI":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "A specialized imaging or data-processing platform used for structuring and sharing high-throughput biological data."
      "atomic force microscopy":
        meaning: NCIT:C17754
        description: "A technique using a scanning probe to image and analyze a material's surface with atomic-level resolution."
        annotations: {description_source: ontology}
      "autoradiography":
        meaning: NCIT:C16314
        description: "A technique used to locate radioactively labeled molecules by recording the radiation they emit on a photographic or sensor plate."
        annotations: {description_source: ontology}
      "brightfield microscopy":
        meaning: NCIT:C19827
        description: "A type of light microscopy in which objects are seen against a bright background."
        annotations: {description_source: ontology}
      "live imaging":
        annotations: {ontology_verdict: partial, description_source: ontology}
        meaning: NCIT:C48799
        description: "Visual representation of a biological component inside a living body, used to provide insight into disease states, molecular characterization, and biological processes."
      "histology":
        meaning: NCIT:C16680
        description: "A technique or procedure used to study the microanatomy of tissues and cellular structure, usually via microscopic examination of tissue slices."
        annotations: {description_source: ontology}
      "confocal microscopy":
        meaning: NCIT:C17753
        description: "A light microscopy system in which a fine laser beam scans the object, rejecting out-of-focus light to produce higher effective resolution."
        annotations: {description_source: ontology}
      "conventional MRI":
        meaning: NCIT:C175525
        description: "Magnetic resonance imaging using standard protocols for high-resolution structural and anatomic characterization, including T1/T2-weighted, FLAIR, and gadolinium-enhanced sequences."
        annotations: {description_source: ontology}
      "diffusion MRI":
        meaning: NCIT:C20117
        description: "An MRI method that measures the diffusion of water in tissue, rather than water content as in conventional MRI."
        annotations: {description_source: ontology}
      "fluorescence microscopy assay":
        meaning: CHMO:0000087
        description: "A light microscopy assay in which the specimen is made to fluoresce by illumination with light of specific wavelengths."
        annotations: {description_source: ontology}
      "functional MRI":
        meaning: NCIT:C17958
        description: "A technique that captures a rapid series of images of an organ and statistically analyzes differences among them, most often used to study brain function."
        annotations: {description_source: ontology}
      "gel filtration chromatography":
        meaning: NCIT:C16433
        description: "Gel permeation or sieve chromatography performed on porous gels that separate solutes on the basis of size."
        annotations: {description_source: ontology}
      "high content screen":
        meaning: EFO:0007550
        description: "An image analysis technique combining automated fluorescence microscopy with multi-parameter quantitative image analysis for large-scale study of cells."
        annotations: {description_source: ontology}
      "high frequency ultrasound":
        meaning: NCIT:C188307
        description: "Ultrasound imaging using frequencies above 10 MHz, yielding improved spatial resolution at the expense of depth of penetration, useful for superficial organs like skin."
        annotations: {description_source: ontology}
      "immunocytochemistry":
        meaning: NCIT:C17731
        description: "A method for detecting proteins or antigens on cells grown in monolayers or suspension using antibodies visualized through a chemical process."
        annotations: {description_source: ontology}
      "immunofluorescence":
        annotations: {ontology_verdict: partial, description_source: ontology}
        meaning: NCIT:C142337
        description: "A microscopy staining method that uses immunofluorescent markers for histological applications on preserved cells."
      "immunohistochemistry":
        meaning: EFO:0022943
        description: "A method using antibodies to detect specific antigens, determining the presence or absence of a protein or portion of a protein."
        annotations: {description_source: ontology}
      "in vivo bioluminescence":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "Imaging of light emitted by luciferase or other bioluminescent reporters within a living organism, used to visualize biological processes non-invasively."
      "laser speckle imaging":
        meaning: NCIT:C116492
        description: "A noninvasive, non-scanning optical imaging technique providing full-field visualization of blood flow, informing on tissue perfusion."
        annotations: {description_source: ontology}
      "magnetic resonance angiography":
        meaning: NCIT:C190557
        description: "Angiography performed using magnetic resonance imaging."
        annotations: {description_source: ontology}
      "magnetic resonance spectroscopy":
        meaning: NCIT:C16810
        description: "Detection and measurement of the resonant spectra of molecular species in a tissue or sample."
        annotations: {description_source: ontology}
      "optical coherence tomography":
        meaning: NCIT:C20828
        description: "Combines ultrasound-like imaging principles with microscope-level resolution, using infrared light reflected off internal tissue microstructure."
        annotations: {description_source: ontology}
      "optical tomography":
        annotations: {ontology_verdict: partial, description_source: ontology}
        meaning: NCIT:C116446
        description: "Creates 3D digital models of an object by interpreting light transmitted and scattered through it, working best on soft, partially translucent tissues."
      "phase-contrast microscopy":
        meaning: NCIT:C16857
        description: "A non-quantitative form of interference microscopy useful for visualizing live cells, rendering differences in optical path length as differences in light intensity."
        annotations: {description_source: ontology}
      "photograph":
        annotations: {ontology_verdict: partial, description_source: ontology}
        meaning: NCIT:C19342
        description: "A photographic image captured electronically."
      "positron emission tomography":
        meaning: NCIT:C17007
        description: "A technique measuring gamma radiation from positron-electron annihilation after a subject receives a positron-emitting radionuclide, used to visualize metabolic activity."
        annotations: {description_source: ontology}
      "spatial frequency domain imaging":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "A wide-field, non-contact optical imaging technique that projects patterned light onto tissue to quantitatively map its optical absorption and scattering properties."
      "traction force microscopy":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "A technique that measures the mechanical forces cells exert on their surrounding substrate, typically by tracking displacement of embedded fiducial markers."
      "transcranial doppler ultrasonography":
        meaning: NCIT:C122930
        description: "A diagnostic technique using pulsed Doppler ultrasound to measure blood-flow velocity through the major blood vessels of the brain."
        annotations: {description_source: ontology}
      "western blot":
        meaning: NCIT:C16357
        description: "A laboratory procedure for detecting proteins or peptides separated by gel electrophoresis and transferred onto a membrane, then detected via labeled antibodies."
        annotations: {description_source: ontology}
      "FIA-MSMS":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "Flow injection analysis coupled with tandem mass spectrometry, a rapid quantitative method that infuses a sample directly into the mass spectrometer without upstream chromatographic separation."
      "FTIR spectroscopy":
        meaning: CHMO:0000636
        description: "Spectroscopy in which the sample absorbs a pulse of infrared radiation and the resulting spectrum is subjected to a Fourier transform."
        annotations: {description_source: ontology}
      "MIB/MS":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "Multiplexed inhibitor bead mass spectrometry, a chemoproteomic method that enriches native kinases from a lysate using immobilized kinase inhibitors prior to mass spectrometry identification."
      "MudPIT":
        meaning: MI:0658
        description: "A method for rapid, large-scale protein identification by multidimensional liquid chromatography coupled to tandem mass spectrometry."
        annotations: {description_source: ontology}
      "RPPA":
        meaning: NCIT:C184797
        description: "An antibody-based functional proteomic microarray that characterizes basal protein expression and protein-modification levels across many samples."
        annotations: {description_source: ontology}
      "TMT quantitation":
        annotations: {ontology_verdict: partial, description_source: ontology}
        meaning: NCIT:C161812
        description: "A proteomic quantitation method where isobaric mass tags are added to a sample, which is then quantified using liquid chromatography/tandem mass spectrometry."
      "high-performance liquid chromatography/tandem mass spectrometry":
        meaning: CHMO:0002876
        description: "A method that couples high-performance liquid chromatography separation with tandem mass spectrometry detection to identify and quantify compounds in complex mixtures."
        annotations: {description_source: inferred}
      "label free mass spectrometry":
        meaning: NCIT:C161800
        description: "Mass spectrometry performed on samples that have not been subjected to isotopic labeling."
        annotations: {description_source: ontology}
      "liquid chromatography-electrochemical detection":
        meaning: NCIT:C198350
        description: "An analytical technique where HPLC with an electrochemical detector separates, identifies, and quantifies substances in a sample."
        annotations: {description_source: ontology}
      "liquid chromatography/mass spectrometry":
        meaning: NCIT:C18475
        description: "A hyphenated technique combining the separation power of liquid chromatography with the detection power of mass spectrometry."
        annotations: {description_source: ontology}
      "liquid chromatography/tandem mass spectrometry":
        meaning: CHMO:0000701
        description: "A method where a sample is separated by liquid chromatography before being ionised and characterised by mass-to-charge ratio using two mass spectrometers in series."
        annotations: {description_source: ontology}
      "mass spectrometry":
        meaning: CHMO:0000470
        description: "A technique in which a sample is converted into gaseous ions that are characterized by their mass-to-charge ratios and relative abundances."
        annotations: {description_source: ontology}
      "proximity extension assay":
        meaning: NCIT:C221636
        description: "A multiplex immunoassay using pairs of oligonucleotide-labeled antibodies that, when in close proximity, are extended and amplified via PCR to detect and quantify proteins."
        annotations: {description_source: ontology}
      "SomaScan":
        meaning: OBI:0003111
        description: "An analyte assay that uses aptamers to detect protein analytes in serum."
        annotations: {description_source: ontology}
      "ultra high-performance liquid chromatography/tandem mass spectrometry":
        meaning: NCIT:C122176
        description: "An analytical technique wherein ultra-high performance liquid chromatography is coupled to tandem mass spectrometry to separate, identify, and quantify substances in a sample."
        annotations: {description_source: ontology}
      "AlgometRx Nociometer":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "A pupillometry-based, objective device used to measure nociception and pain response."
      "quantitative sensory testing":
        meaning: NCIT:C155860
        description: "A non-invasive method for diagnosing peripheral nervous system disorders by determining sensation and pain thresholds compared to standard values."
        annotations: {description_source: ontology}
      "Child Behavior Checklist for Ages 1.5-5":
        meaning: NCIT:C165712
        description: "A standardized measure designed to detect behavioral and emotional problems in children 1.5-5 years old, rated by parents, daycare providers, and teachers."
        annotations: {description_source: ontology}
      "Child Behavior Checklist for Ages 6-18":
        meaning: NCIT:C165711
        description: "A standardized measure designed to detect behavioral and emotional problems in children and adolescents, completed by a parent or caretaker."
        annotations: {description_source: ontology}
      "Children's Dermatology Life Quality Index Questionnaire":
        meaning: NCIT:C119092
        description: "A standardized rating scale used to assess quality of life in children with skin conditions."
        annotations: {description_source: ontology}
      "Corsi blocks":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "A visuospatial working-memory task (Corsi block-tapping test) in which a subject reproduces a sequence of blocks tapped by an examiner."
      "FACE-Q Appearance-related Distress":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "A patient-reported outcome instrument module from the FACE-Q battery that measures psychological distress related to facial appearance."
      "Focus group":
        meaning: NCIT:C154589
        description: "A small, usually diverse group of people whose response to something is studied to determine the response expected from a larger population."
        annotations: {description_source: ontology}
      "Interview":
        meaning: NCIT:C16751
        description: "A conversation with an individual regarding background, personal and professional details, and opinions on specific subjects posed by the interviewer."
        annotations: {description_source: ontology}
      "NIH Toolbox":
        meaning: NCIT:C154482
        description: "A comprehensive set of neuro-behavioral measures that assess cognitive, emotional, sensory, and motor functions, designed to be run on an iPad."
        annotations: {description_source: ontology}
      "PROMIS Cognitive Function":
        meaning: NCIT:C122365
        description: "The collection of PROMIS item scales that assess perceived difficulties in intellectual processes, capabilities, and deficits."
        annotations: {description_source: ontology}
      "Riccardi and Ablon scales":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "Clinical rating scales for grading the severity of neurofibromatosis-associated features such as cutaneous neurofibromas."
      "Skindex-16":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "A 16-item patient-reported quality-of-life questionnaire assessing the impact of skin disease on daily functioning, emotions, and symptoms."
      "Social Responsiveness Scale":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "A standardized questionnaire that quantifies the severity of social-communication deficits associated with autism spectrum disorder."
      "Social Responsiveness Scale, Second Edition":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "The revised (second) edition of the Social Responsiveness Scale questionnaire, quantifying social-communication deficits associated with autism spectrum disorder."
      "Von Frey test":
        meaning: MMO:0000752
        description: "A test evaluating mechanical allodynia in mice and rats using von Frey hairs or fibers of varying stiffness."
        annotations: {description_source: ontology}
      "actigraphy":
        meaning: NCIT:C180883
        description: "A method for continuous recording of body movement using a worn sensor to measure rest/activity (sleep/wake) cycles over days to weeks."
        annotations: {description_source: ontology}
      "active avoidance learning behavior assay":
        meaning: MMO:0000302
        description: "A conditioning paradigm in which an animal learns to control application of an aversive stimulus by performing a specific behavior to avoid it."
        annotations: {description_source: ontology}
      "auditory brainstem response":
        meaning: NCIT:C184949
        description: "A neurologic test of auditory brainstem function in response to auditory stimuli, used to diagnose abnormalities of the 8th cranial nerve and auditory pathways."
        annotations: {description_source: ontology}
      "blood chemistry measurement":
        meaning: NCIT:C47868
        description: "The determination of the measured concentrations of chemical constituents of the blood by assay in a clinical laboratory."
        annotations: {description_source: ontology}
      "body size trait measurement":
        meaning: EFO:0004302
        description: "A measurement of the size, weight, and proportions of the human or other primate body."
        annotations: {description_source: ontology}
      "cNF-Skindex":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "A Skindex-derived quality-of-life questionnaire adapted to assess the impact of cutaneous neurofibromas."
      "clinical data":
        meaning: NCIT:C15783
        description: "Data obtained through patient examination or treatment."
        annotations: {description_source: ontology}
      "cognitive assessment":
        meaning: NCIT:C62736
        description: "The examination of the cognitive capacities or deficits of an individual through tests that probe abilities such as perception, learning, and reasoning."
        annotations: {description_source: ontology}
      "contextual conditioning behavior assay":
        meaning: MMO:0000572
        description: "A test in which an aversive stimulus is administered within a certain environment, followed by assessment of fear/emotion-based reactions in that environment without the stimulus."
        annotations: {description_source: ontology}
      "distortion product otoacoustic emissions":
        meaning: NCIT:C184951
        description: "A neurologic test providing a preneural, noninvasive assessment of cochlear function via emissions generated in response to two tones presented in the ear canal."
        annotations: {description_source: ontology}
      "elevated plus maze test":
        meaning: MMO:0000262
        description: "A method using a plus-shaped, elevated apparatus with enclosed and open arms to measure anxiety-related behavior in a test animal."
        annotations: {description_source: ontology}
      "feeding assay":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "An assay that measures an organism's food consumption or feeding behavior under experimental conditions."
      "gait measurement":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "Quantitative assessment of an individual's walking pattern, including parameters such as stride length, cadence, and speed."
      "genotyping":
        meaning: EFO:0000750
        description: "An assay in which variation in a part of or the whole genome is analysed."
        annotations: {description_source: ontology}
      "grip strength":
        meaning: NCIT:C139210
        description: "An assessment of hand muscle strength that measures the force with which one holds or grasps."
        annotations: {description_source: ontology}
      "hand-held dynamometry":
        meaning: NCIT:C186193
        description: "A technique to assess isometric muscle strength using a hand-held dynamometer."
        annotations: {description_source: ontology}
      "metabolic screening":
        annotations: {ontology_verdict: partial, description_source: ontology}
        meaning: NCIT:C137828
        description: "A broad screening tool that measures glucose, electrolytes, and metabolites in blood serum to evaluate organ function and screen for metabolic conditions."
      "n-back task":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "A working-memory task in which a subject indicates whether a current stimulus matches the one presented n steps earlier in a sequence."
      "neuropsychological assessment":
        meaning: NCIT:C165543
        description: "A performance-based method to assess cognitive functioning, used to examine the cognitive consequences of brain damage, disease, and severe mental illness."
        annotations: {description_source: ontology}
      "novelty response behavior assay":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "A behavioral assay that measures an animal's exploratory or recognition response when presented with a novel object or environment."
      "open field test":
        meaning: MMO:0000258
        description: "A test utilizing a walled enclosure to measure movement and exploratory behavior of an experimental subject."
        annotations: {description_source: ontology}
      "optokinetic reflex assay":
        meaning: MMO:0000754
        description: "A testing method involving a rotating patterned stimulus passed across the subject's visual field to assess reflexive eye tracking."
        annotations: {description_source: ontology}
      "pattern electroretinogram":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "An electrophysiological recording of retinal ganglion cell responses to a reversing, patterned visual stimulus."
      "polysomnography":
        meaning: NCIT:C114185
        description: "A group of tests taken during sleep that record brain wave changes, eye movements, breathing rate, blood pressure, heart rate, and muscle electrical activity."
