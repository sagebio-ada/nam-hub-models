        description: Raw or minimally processed data.
        annotations: {ontology_verdict: partial}
        meaning: NCIT:C142663
      "Level 2":
        description: Data that has undergone a basic or initial processing step, like quality control, alignment, or stitching.
        annotations: {ontology_verdict: partial}
        meaning: NCIT:C84340
      "Level 3":
       description: Files that contain summary counts, coverage files, or other processed representations of the data.
       annotations: {ontology_verdict: partial}
       meaning: EDAM:data_3917
      "Level 4":
        description: Files that contain data related to applied models or aggregate representations of the data.
        annotations: {ontology_verdict: partial}
        meaning: MAMO:0000023
      "Auxiliary":
        description: Additional files that contain information or experimental details, but do not contain data or processed derivatives.
        annotations: {ontology_verdict: partial}
        meaning: MESH:D058537
      "Not Applicable":
        description: Files that fall outside of the level structure or are uploaded as a package.
        meaning: NCIT:C48660
      "Metadata":
       description: Files that are or will be stored and shared as metadata.
       meaning: NCIT:C52095

  NamContextEnum:
    description: NAM application context associated with files in the dataset.
    permissible_values:
      "Biosamples":
        meaning: NCIT:C43412
        description: "Data or files pertaining to biological specimens collected from subjects, such as tissue, blood, or other biosamples."
        annotations: {description_source: inferred}
      "Subjects / Donors":
        annotations: {ontology_verdict: partial}
        meaning: MESH:D035842
        description: "Persons who are enrolled in research studies or who are otherwise the subjects of research."
      "Files / Data Types":
        annotations: {ontology_verdict: partial}
        meaning: EFO:0004095
        description: "A file stored for use on a computer containing data."
      "In Chemico / Biomaterials":
        annotations: {ontology_verdict: no_match, description_source: inferred}
        description: "NAM application context covering in-chemico test methods (chemistry-based assays performed without a biological system) and biomaterials characterization."
      "Assays / Conditions":
        annotations: {ontology_verdict: partial, description_source: ontology}
        meaning: NCIT:C60819
        description: "A qualitative or quantitative analysis performed to determine the amount of a constituent in a sample, or the biological or pharmacological properties of a substance."
      "Ontologies / Standards":
        annotations: {ontology_verdict: partial, description_source: ontology}
        meaning: NCIT:C21270
        description: "A terminology that includes explicit formal specification of how to represent the objects, concepts, relationships, and other entities within it."
      "Imaging Metadata":
        annotations: {ontology_verdict: partial, description_source: ontology}
        meaning: NCIT:C17369
        description: "Any technology or method that aids in the visualization of a biological process, cell, tissue, or organ for screening, diagnosis, or therapy."
      "Pharmacokinetics / ADMET":
        annotations: {ontology_verdict: partial, description_source: ontology}
        meaning: NCIT:C15299
        description: "The quantitative analysis of the absorption, distribution, binding, biotransformation, elimination, and excretion of a drug within biological systems."
      "Analytical Models":
        annotations: {ontology_verdict: partial, description_source: inferred}
        meaning: MAMO:0000023
        description: "A mathematical or computational representation used to simulate, predict, or analyze biological or chemical processes."

