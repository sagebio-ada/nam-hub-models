[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "namhub"
description = "A repository containing data models for NAMHub curation.."
authors = [

]
license = "LicenseRef-Custom"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

# Everything needed to edit portal_schemas/*.yaml and run `just lint`. This is the
# baseline for a normal contributor, so it lives here rather than in an opt-in group:
# `uv sync` alone must produce a working editing-and-linting environment.
dependencies = [
  # Console scripts: linkml-lint (just lint), gen-doc, gen-yaml
  "linkml >=1.9.3",
  # The `just` command runner itself, which fronts every recipe in the justfile
  "rust-just>=1.57.0",
]

[dependency-groups]
# Rendering and serving the documentation site: `just installdocs`, then gen-doc /
# testdoc. Builds on the base dependencies above, which supply gen-doc itself.
docs = [
    # Invoked directly as `mkdocs serve`; declared explicitly rather than relying on
    # mkdocs-material to pull it in transitively. Capped below 2.0, which upstream has
    # announced will remove the plugin system that mermaid2 and the extras rely on.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "mkdocs-pymdownx-material-extras>=2.5.6",
]

# Deploying the schema: the linkml_to_csv.py and create_json_from_model.py paths
# behind `just gen-model` (gen-csv + gen-json), plus register_schema.py.
deploy = [
    # The "curator" extra provides generate_jsonschema, used by the gen-json route
    "synapseclient[curator]>=4.13.0",
    # Imported directly by linkml_to_csv.py and create_json_from_model.py
    "pyyaml>=6.0",
]
# NOTE: create_json_from_model.py also exposes `--route schematic`, which is NOT
# installable here and is left undeclared on purpose. Every published schematicpy
# release caps synapseclient at <=4.8.0, so it cannot coexist with the
# synapseclient[curator]>=4.13.0 that the default curator route requires. Adding it
# to this group makes the group unresolvable.

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["portal_schemas"]

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
exclude = [

]
# Set oldest supported Python version
target-version = "py310"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"

[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*"
]
