id: https://namhub.synapse.org/portal_schemas
name: namhub
version: 3.0.0
description: >-
  NAMHub portal data schemas — backend Synapse tables and the Landscape data
  collection form. Portal tables are backed by Synapse project syn74360399.
  NAM classification uses the New Approach Methods Ontology (NAMO) developed
  by the Monarch Initiative (https://github.com/monarch-initiative/namo).

prefixes:
  linkml: https://w3id.org/linkml/
  namhub: https://namhub.synapse.org/portal_schemas/
  namo: https://github.com/monarch-initiative/namo/
  DUO: http://purl.obolibrary.org/obo/DUO_
  schema: http://schema.org/

default_prefix: namhub
default_range: string

imports:
  - linkml:types
  - enums

# ── Classes ────────────────────────────────────────────────────────────────────

classes:

  # -- Landscape (data collection form) ----------------------------------------

  Landscape:
    description: >-
      Preliminary information about datasets intended to be shared through
      NAM Hub. Used by TDC teams to declare expected data uploads.
    slots:
      - landscape_id
      - dataset_name
      - dataset_group
      - derived_from
      - dataset_description
      - dataset_assay
      - dataset_species
      - dataset_file_format
      - dataset_category
      - dataset_processing_level
      - context_of_use
      - applicable_standards
      - expected_number_of_samples
      - file_ratio
      - file_ratio_unit
      - upload_by_date
      - data_contribution_lead
      - study_name
      - study_aim
      - comments
    slot_usage:
      landscape_id:
        required: true
      dataset_name:
        required: true
      dataset_description:
        required: true
      dataset_assay:
        required: true
      dataset_species:
        required: true
      dataset_file_format:
        required: true
      dataset_category:
        required: true
      dataset_processing_level:
        required: true
      context_of_use:
        required: true
      expected_number_of_samples:
        required: true
      file_ratio:
        required: true
      file_ratio_unit:
        required: true
      upload_by_date:
        required: true
      data_contribution_lead:
        required: true
      study_name:
        required: true
      study_aim:
        required: true

  # -- Portal tables -----------------------------------------------------------

  Studies:
    description: >-
      One row per Technology Development Center (TDC) study in the NAMHub
      program. Synapse table: syn75404711.
    slots:
      - study_id
      - study_name
      - study_leads
      - summary
      - institution
      - funding_agency
      - synapse_project_id
      - study_doi
      - disease_focus
      - alternate_name
      - nams_tech_focus
      - grant_id
    slot_usage:
      study_id:
        required: true
      study_name:
        required: true

  Datasets:
    description: >-
      One row per dataset — Synapse-hosted or external (e.g. GEO).
      Links to Studies and NAMs. Synapse table: syn75404713.
    slots:
      - dataset_id
      - title
      - description
      - study_id
      - study_name
      - assay
      - data_type
      - species
      - format
      - repository
      - external_link
      - doi
      - release_date
      - dataset_item_count
      - dataset_size_in_bytes
      - has_croissant_metadata
      - croissant_metadata_url
      - access_type
      - nam_id
    slot_usage:
      title:
        required: true

  People:
    description: >-
      Investigators and contributors associated with NAMHub studies.
      Synapse table: syn75404714.
    slots:
      - investigator_id
      - first_name
      - last_name
      - institution
      - role
      - study_id
      - grant_id
      - orcid_id
      - synapse_id
      - email
      - portal_display
    slot_usage:
      first_name:
        required: true
      last_name:
        required: true

  Grants:
    description: >-
      Backend grant records linked to Studies. Not directly surfaced on the
      portal. Synapse table: syn75404715.
    slots:
      - grant_id
      - grant_name
      - grant_number
      - grant_type
      - grant_institution
      - abstract
      - investigator
      - funding_agency
      - nih_reporter_link
    slot_usage:
      grant_id:
        required: true

  NAMs:
    description: >-
      One row per New Approach Method (NAM). Modelled after NF/MC2 Tools tables.
      NAM type classification uses the New Approach Methods Ontology (NAMO)
      from the Monarch Initiative (https://github.com/monarch-initiative/namo).
      Governance fields follow Synapse/Sage portal conventions.
      Synapse table: syn75404716.
    see_also:
      - https://github.com/monarch-initiative/namo
    slots:
      - nam_id
      - nam_name
      - description
      - development_status
      - namo_class
      - namo_category
      - namo_id
      - organism
      - tissue_or_cell_type
      - endpoints_measured
      - study_id
      - dataset_id
      - related_publications
      - external_link
      - synapse_entity_id
      - access_type
      - access_requirements
      - duo_code
      - acknowledgement_statements
      - license
      - portal_display
    slot_usage:
      nam_id:
        required: true
      nam_name:
        required: true

  Publications:
    description: >-
      Publications associated with NAMHub studies, grants, or NAMs.
      Synapse table: syn75404744.
    slots:
      - pub_med_id
      - publication_title
      - authors
      - journal
      - publication_year
      - doi
      - pub_med_link
      - keywords
      - study_id
      - grant_id
      - nam_id
      - data_type
      - assay
      - synapse_entity_id
    slot_usage:
      publication_title:
        required: true

  # -- Record classes ----------------------------------------------------------
  # Records are entered once and referenced by ID from the files generated from
  # them, so a correction is made in one place.

  Individual:
    description: >-
      One row per individual (donor or patient) whose biospecimens produced
      data in NAMHub, with their demographics.
    slots:
      - individual_id
      - species
      - sex
      - ethnicity
      - reported_ancestry
    slot_usage:
      individual_id:
        identifier: true
        required: true
      species:
        required: true
        multivalued: false

  Diagnosis:
    description: >-
      One row per diagnosis of an individual. An individual with more than one
      diagnosis has one row for each.
    slots:
      - individual_id
      - diagnosis
      - age_at_diagnosis
      - age_unit
    slot_usage:
      individual_id:
        required: true
      diagnosis:
        required: true

  IBDDiagnosis:
    is_a: Diagnosis
    description: >-
      Diagnosis of an individual in an inflammatory bowel disease study, with
      IBD-specific clinical details.
    slots:
      - aild

  Biospecimen:
    description: >-
      One row per biospecimen (sample) collected from an individual. Files
      reference the biospecimens they were generated from by Biospecimen ID.
    slots:
      - biospecimen_id
      - individual_id
      - anatomic_site
      - age_at_collection
      - age_unit
      - endoscopic_status
      - sample_title
    slot_usage:
      biospecimen_id:
        identifier: true
        required: true
      individual_id:
        required: true
      anatomic_site:
        required: true

  # -- File classes ------------------------------------------------------------
  # Organized by processing level, following the NIH Genomic Data Sharing
  # levels and the HTAN2 sequencing model. Abstract classes hold attributes
  # shared across assays and are not Curator templates themselves.

  File:
    abstract: true
    description: Attributes shared by every data file.
    slots:
      - filename
      - file_format
      - assay
      - biospecimen_id
      - md5
    slot_usage:
      filename:
        required: true
      file_format:
        required: true
      assay:
        required: true
        multivalued: false
      biospecimen_id:
        required: true
        multivalued: true
        description: >-
          Biospecimen ID(s) of the biospecimen(s) the file was generated from.
          A file aggregating several biospecimens lists each of them.

  SequencingLevel1:
    abstract: true
    is_a: File
    description: Raw sequencing reads (Level 1).
    slots:
      - sequencing_platform
      - library_layout
      - sequencing_batch_id
    slot_usage:
      sequencing_platform:
        required: true
      library_layout:
        required: true

  SequencingLevel2:
    abstract: true
    is_a: SequencingLevel1
    description: Reads aligned to a reference, and the workflow that aligned them (Level 2).
    slots:
      - genomic_reference
      - workflow_name
      - workflow_version
      - workflow_link
      - parent_file_id
    slot_usage:
      genomic_reference:
        required: true
      workflow_name:
        required: true
      workflow_version:
        required: true

  SequencingLevel3and4:
    abstract: true
    is_a: SequencingLevel2
    description: >-
      Processed outputs such as count matrices (Level 3) and analysis results
      such as clustered or annotated objects (Level 4).
    slots:
      - workflow_parameters_description

  SingleNucleusLevel1:
    abstract: true
    is_a: SequencingLevel1
    description: Library preparation attributes shared by single-nucleus Level 1 files.
    slots:
      - nucleic_acid_source
      - library_preparation_method
      - read_indicator
    slot_usage:
      file_format:
        range: SequencingLevel1FileFormatEnum
      nucleic_acid_source:
        required: true
      library_preparation_method:
        required: true
      read_indicator:
        required: true

  SnRNASeqLevel1:
    is_a: SingleNucleusLevel1
    description: Raw FASTQ files from single-nucleus RNA-seq.
    slot_usage:
      assay:
        range: SnRNASeqAssayEnum

  SnRNASeqLevel2:
    is_a: SequencingLevel2
    description: Aligned reads from single-nucleus RNA-seq.
    slots:
      - cell_barcode_tag
      - umi_tag
    slot_usage:
      assay:
        range: SnRNASeqAssayEnum
      file_format:
        range: SnRNASeqLevel2FileFormatEnum

  SnRNASeqLevel3and4:
    is_a: SequencingLevel3and4
    description: >-
      Gene expression matrices and analysis objects from single-nucleus
      RNA-seq.
    slots:
      - matrix_type
      - cell_total
    slot_usage:
      assay:
        range: SnRNASeqAssayEnum
      file_format:
        range: SingleNucleusLevel3and4FileFormatEnum
      matrix_type:
        required: true

  SnATACSeqLevel1:
    is_a: SingleNucleusLevel1
    description: Raw FASTQ files from single-nucleus ATAC-seq.
    slot_usage:
      assay:
        range: SnATACSeqAssayEnum

  SnATACSeqLevel2:
    is_a: SequencingLevel2
    description: >-
      Aligned reads and fragments files from single-nucleus ATAC-seq.
    slot_usage:
      assay:
        range: SnATACSeqAssayEnum
      file_format:
        range: SnATACSeqLevel2FileFormatEnum

  SnATACSeqLevel3and4:
    is_a: SequencingLevel3and4
    description: >-
      Peak calls, peak-by-cell matrices and analysis objects from
      single-nucleus ATAC-seq.
    slots:
      - matrix_type
      - cell_total
      - peak_calling_software
    slot_usage:
      assay:
        range: SnATACSeqAssayEnum
      file_format:
        range: SingleNucleusLevel3and4FileFormatEnum

# ── Slots ──────────────────────────────────────────────────────────────────────

slots:

  # -- Shared / cross-table ----------------------------------------------------

  study_id:
    title: Study_id
    description: Study identifier linking to the Studies table (syn75404711).
    multivalued: false
    range: string

  study_name:
    title: Study Name
    description: Full display name of the study.
    range: string

  institution:
    title: Institution
    description: Affiliated institution(s).
    multivalued: true
    range: string

  funding_agency:
    title: Funding Agency
    description: Funding agency or agencies (e.g. NIH Common Fund).
    multivalued: true
    range: string

  grant_id:
    title: Grant_id
    description: Grant identifier linking to the Grants table (syn75404715).
    multivalued: false
    range: string

  description:
    title: Description
    description: Free-text description.
    range: string

  doi:
    title: Doi
    description: Digital Object Identifier (DOI).
    range: uri

  assay:
    title: Assay
    description: Experimental assay or method.
    multivalued: true
    range: AssayEnum

  data_type:
    title: Data Type
    description: Broad category of the data type.
    multivalued: true
    range: DataCategoryEnum

  species:
    title: Species
    description: Species of origin.
    multivalued: true
    range: SpeciesEnum

  access_type:
    title: Access Type
    description: Data access level.
    range: AccessTypeEnum

  nam_id:
    title: Nam_id
    description: NAM identifier(s) linking to the NAMs table (syn75404716).
    multivalued: true
    range: string

  external_link:
    title: External Link
    description: External URL for additional resources.
    range: uri

  synapse_entity_id:
    title: Synapse Entity_id
    description: Synapse project or entity ID (syn-prefixed).
    range: string
    pattern: "^syn\\d+$"

  portal_display:
    title: Portal Display
    description: Whether this record should be displayed on the public portal.
    range: boolean
    ifabsent: "true"

  # -- Landscape slots ---------------------------------------------------------

  landscape_id:
    title: Landscape_id
    description: Unique identifier for the landscape entry.
    range: string

  dataset_name:
    title: Dataset Name
    description: Name of the dataset.
    range: string

  dataset_group:
    title: Dataset Group
    description: >-
      Identifier shared by every row that describes the same dataset, where the
      dataset is split into one row per file type. Also set one on a single-row
      dataset when another dataset's Derived From names it.
    range: string

  derived_from:
    title: Derived From
    description: >-
      Optional. Dataset Group of the dataset this row's files are processed
      from, such as the FASTQ dataset a count matrix was produced from.
    range: string

  dataset_description:
    title: Dataset Description
    description: A text description of the files contained in this dataset.
    range: string

  dataset_assay:
    title: Dataset Assay
    description: Experimental method used to generate files in the dataset.
    range: AssayEnum

  dataset_species:
    title: Dataset Species
    description: Species of origin associated with files in the dataset.
    range: SpeciesEnum

  dataset_file_format:
    title: Dataset File Format
    description: >-
      File type of the files this row describes. Each row covers one file type; a
      dataset with several file types has one row for each, sharing a Dataset
      Group. List only the file types required to process this data type
      independently.
    range: FileFormatEnum

  dataset_category:
    title: Dataset Category
    description: >-
      Type of data or scientific content represented in the dataset (e.g. gene
      expression, imaging, clinical data) — see valid values for the full list.
    range: DataCategoryEnum

  dataset_processing_level:
    title: Dataset Processing Level
    description: >-
      Level of processing associated with the dataset. Always list the raw
      (Level 1) data; list processed levels only where agreed with the NAMHub
      data team.
    range: ProcessLevelEnum

  context_of_use:
    title: Context Of Use
    description: >-
      Free-text statement of the intended context(s) of use for this dataset —
      how and for what purpose the data is meant to be used, following the FDA
      Biomarker Qualification Program's Context of Use framework
      (https://www.fda.gov/drugs/biomarker-qualification-program/context-use).
      Multiple values permitted.
    multivalued: true

  applicable_standards:
    title: Applicable Standards
    description: >-
      Optional. Controlled vocabularies, ontologies or data models your team
      already uses to organize and annotate these files. Used to inform the
      NAMHub metadata model.
    range: string

  expected_number_of_samples:
    title: Expected Number Of Samples
    description: >-
      Estimated total number of physical biospecimen samples represented in the
      dataset (e.g. 200 participants at 3 time points = 600 total samples). Used
      with File Ratio to work out how many files to expect, and to track
      completeness: an estimate is fine, and a difference from what is eventually
      uploaded is something to discuss, not a penalty.
    range: integer

  file_ratio:
    title: File Ratio
    description: >-
      Number of files of this row's file type, relative to its samples and read
      according to File Ratio Unit. For example: 2 Files per sample for paired-end
      FASTQs, 30 Samples per file for a count matrix covering 30 samples, or 1
      Total files for a Docker image.
    range: integer
    minimum_value: 1

  file_ratio_unit:
    title: File Ratio Unit
    description: >-
      How to read File Ratio: as files per sample, as samples per file, or as a
      total count for data that isn't organized by sample.
    range: FileRatioUnitEnum

  upload_by_date:
    title: Upload By Date
    description: >-
      Deadline by which files for this dataset must be uploaded, within the
      project period. Uploading earlier is welcome. Dates are expected to shift;
      plan uploads in regular, small batches that roughly follow when the data
      is generated.
    range: string

  data_contribution_lead:
    title: Data Contribution Lead
    description: >-
      Name of the one person responsible for uploading and curating this
      dataset's files and metadata, usually a computational biologist or data
      manager. They will be assigned the curation task. Name a single person,
      and do not list the principal investigator.
    range: string

  study_aim:
    title: Study Aim
    description: Key connecting the expected data to aims in the research proposal.
    range: string

  comments:
    title: Comments
    description: Additional information not captured in other fields.
    range: string

  # -- Studies slots -----------------------------------------------------------

  study_leads:
    title: Study Leads
    description: Principal investigators or study leads.
    multivalued: true
    range: string

  summary:
    title: Summary
    description: Brief description of the study's goals and approach.
    range: string

  synapse_project_id:
    title: Synapse Project_id
    description: Synapse project entity ID housing the study's files.
    range: string
    pattern: "^syn\\d+$"

  study_doi:
    title: Study Doi
    description: Digital Object Identifier (DOI) for the study.
    range: uri

  disease_focus:
    title: Disease Focus
    description: Disease areas or conditions the study addresses.
    multivalued: true
    range: string

  alternate_name:
    title: Alternate Name
    description: Acronym or short name for the study.
    multivalued: true
    range: string

  nams_tech_focus:
    title: NAMs Tech Focus
    description: New Approach Methodology technology focus areas.
    multivalued: true
    range: string

  # -- Datasets slots ----------------------------------------------------------

  dataset_id:
    title: Dataset_id
    description: >-
      Synapse Dataset entity ID. Blank for externally hosted datasets.
    range: string
    pattern: "^syn\\d+$"

  title:
    title: Title
    description: Display title of the dataset.
    range: string

  format:
    title: Format
    description: File formats contained in the dataset.
    multivalued: true
    range: FileFormatEnum

  repository:
    title: Repository
    description: Repository where the dataset is hosted.
    range: RepositoryEnum

  release_date:
    title: Release Date
    description: Date the dataset was made publicly available.
    range: date

  dataset_item_count:
    title: Dataset Item Count
    description: Number of files or items in the dataset.
    range: integer

  dataset_size_in_bytes:
    title: Dataset Size In Bytes
    description: Total size of the dataset in bytes.
    range: integer

  has_croissant_metadata:
    title: Has Croissant Metadata
    description: Whether the dataset has associated Croissant-format metadata.
    range: boolean

  croissant_metadata_url:
    title: Croissant Metadata Url
    description: URL to the Croissant metadata file for this dataset.
    range: uri

  # -- People slots ------------------------------------------------------------

  investigator_id:
    title: Investigator_id
    description: Unique identifier for the investigator.
    range: string

  first_name:
    title: First Name
    description: First name.
    range: string

  last_name:
    title: Last Name
    description: Last name.
    range: string

  role:
    title: Role
    description: Role in the NAMHub program.
    range: RoleEnum

  orcid_id:
    title: Orcid_id
    description: ORCID persistent digital identifier.
    range: string
    pattern: "^\\d{4}-\\d{4}-\\d{4}-\\d{3}[\\dX]$"

  synapse_id:
    title: Synapse_id
    description: Synapse user account ID.
    range: string

  email:
    title: Email
    description: Contact email address.
    range: string
    pattern: "^[^@]+@[^@]+\\.[^@]+$"

  # -- Grants slots ------------------------------------------------------------

  grant_name:
    title: Grant Name
    description: Full title of the grant.
    range: string

  grant_number:
    title: Grant Number
    description: NIH grant number (e.g. UM1TR006029).
    range: string

  grant_type:
    title: Grant Type
    description: Grant mechanism type (e.g. UM1, R01).
    range: string

  grant_institution:
    title: Grant Institution
    description: Institution holding the grant.
    range: string

  abstract:
    title: Abstract
    description: Grant abstract.
    range: string

  investigator:
    title: Investigator
    description: Name of the principal investigator.
    range: string

  nih_reporter_link:
    title: Nih Reporter Link
    description: URL to the grant record on NIH Reporter.
    range: uri

  # -- NAMs slots --------------------------------------------------------------

  nam_name:
    title: Nam Name
    description: Display name of the NAM.
    range: string

  development_status:
    title: Development Status
    description: Current development stage of the NAM.
    range: DevelopmentStatusEnum

  namo_class:
    title: Namo Class
    description: >-
      Specific class name from the New Approach Methods Ontology (NAMO).
      Examples: Organoid, OrganOnChip, QSARModel, PBPKModel.
    range: string
    see_also:
      - https://github.com/monarch-initiative/namo

  namo_category:
    title: Namo Category
    description: >-
      Top-level branch from the NAMO ontology.
      Examples: InVitroBiological, InSilico, InChemico.
    range: string
    see_also:
      - https://github.com/monarch-initiative/namo

  namo_id:
    title: Namo_id
    description: >-
      NAMO ontology term identifier. Format: NAMO:XXXXXXX.
    range: string
    pattern: "^NAMO:\\d+$"
    see_also:
      - https://github.com/monarch-initiative/namo

  organism:
    title: Organism
    description: Organism(s) the NAM is derived from or applicable to.
    multivalued: true
    range: SpeciesEnum

  tissue_or_cell_type:
    title: Tissue Or Cell Type
    description: Tissue or cell type(s) used in the NAM.
    multivalued: true
    range: string

  endpoints_measured:
    title: Endpoints Measured
    description: Biological or chemical endpoints the NAM measures.
    multivalued: true
    range: string

  dataset_id_list:
    title: Dataset Id_list
    description: Dataset identifier(s) linking to the Datasets table (syn75404713).
    multivalued: true
    range: string

  related_publications:
    title: Related Publications
    description: PubMed IDs of publications describing or using this NAM.
    multivalued: true
    range: string

  access_requirements:
    title: Access Requirements
    description: >-
      Description of any Synapse Access Requirements governing the underlying data.
    range: string

  duo_code:
    title: Duo Code
    description: >-
      Data Use Ontology (GA4GH DUO) codes restricting data reuse.
      Examples: GRU (General Research Use), HMB (Health/Medical/Biomedical),
      DS (Disease Specific).
    multivalued: true
    range: string
    see_also:
      - http://purl.obolibrary.org/obo/duo.owl

  acknowledgement_statements:
    title: Acknowledgement Statements
    description: Required attribution or acknowledgement text for data reuse.
    range: string

  license:
    title: License
    description: License governing reuse of the underlying data (e.g. CC-BY-4.0).
    range: string

  # -- Publications slots ------------------------------------------------------

  pub_med_id:
    title: Pub Med_id
    description: PubMed identifier (PMID).
    range: string

  publication_title:
    title: Publication Title
    description: Full title of the publication.
    range: string

  authors:
    title: Authors
    description: Author list.
    range: string

  journal:
    title: Journal
    description: Journal name.
    range: string

  publication_year:
    title: Publication Year
    description: Year of publication.
    range: integer

  pub_med_link:
    title: Pub Med Link
    description: URL to the PubMed entry.
    range: uri

  keywords:
    title: Keywords
    description: Publication keywords or MeSH terms.
    multivalued: true
    range: string

  # -- Record slots (Individual, Diagnosis, Biospecimen) -----------------------

  individual_id:
    title: Individual ID
    description: Unique non-PII identifier for the individual (donor/patient) from which data were generated.
    range: string

  sex:
    title: Sex
    description: Biological sex of the individual.
    range: SexEnum

  ethnicity:
    title: Ethnicity
    description: Self-reported ethnicity of the individual.
    range: string

  reported_ancestry:
    title: Reported Ancestry
    description: Self-reported or clinically recorded ancestry of the individual.
    range: string

  diagnosis:
    title: Diagnosis
    description: Clinical diagnosis of the individual.
    range: DiagnosisEnum

  age_at_diagnosis:
    title: Age at Diagnosis
    description: Age of the individual when diagnosed. Use with Age Unit.
    range: float
    minimum_value: 0

  aild:
    title: AILD
    description: Whether the individual has auto-immune liver disease associated with IBD.
    range: BooleanReportedEnum

  biospecimen_id:
    title: Biospecimen ID
    description: Unique non-PII identifier for the biospecimen (sample).
    range: string

  anatomic_site:
    title: Anatomic Site
    description: Anatomic site the biospecimen was collected from.
    range: AnatomicSiteEnum

  age_at_collection:
    title: Age at Collection
    description: Age of the individual when the biospecimen was collected. Use with Age Unit.
    range: float
    minimum_value: 0

  age_unit:
    title: Age Unit
    description: Unit for the age fields.
    range: AgeUnitEnum

  endoscopic_status:
    title: Endoscopic Status
    description: Endoscopic inflammation status of the tissue at time of collection.
    range: EndoscopicStatusEnum

  sample_title:
    title: Sample Title
    description: Sample title from the submitting investigator (e.g. GEO Sample_title field).
    range: string

  # -- File slots --------------------------------------------------------------

  filename:
    title: Filename
    description: Name of the file, including its extension.
    range: string

  file_format:
    title: File Format
    description: Format of the file.
    range: FileFormatEnum

  md5:
    title: MD5
    description: MD5 checksum of the file for integrity verification.
    range: string
    pattern: "^[0-9a-f]{32}$"

  parent_file_id:
    title: Parent File ID
    description: >-
      Synapse ID(s) of the file(s) this file was produced from, such as the
      FASTQs an alignment was made from.
    multivalued: true
    range: string
    pattern: "^syn[0-9]+$"

  sequencing_platform:
    title: Sequencing Platform
    description: Sequencing instrument used to generate the data.
    range: SequencingPlatformEnum

  library_layout:
    title: Library Layout
    description: Whether reads are paired-end or single-end.
    range: LibraryLayoutEnum

  sequencing_batch_id:
    title: Sequencing Batch ID
    description: Identifier of the sequencing run or batch.
    range: string

  read_indicator:
    title: Read Indicator
    description: Which read file this is (R1, R2, I1, I2).
    range: ReadIndicatorEnum

  nucleic_acid_source:
    title: Nucleic Acid Source
    description: Source and type of nucleic acid used to construct the sequencing library.
    range: NucleicAcidSourceEnum

  library_preparation_method:
    title: Library Preparation Method
    description: Library preparation kit or method used.
    range: LibraryPrepMethodEnum

  genomic_reference:
    title: Genomic Reference
    description: Reference genome assembly the reads were aligned to.
    range: GenomicReferenceEnum

  workflow_name:
    title: Workflow Name
    description: Name of the workflow or software that produced the file (e.g. Cell Ranger ARC).
    range: string

  workflow_version:
    title: Workflow Version
    description: Version of the workflow or software that produced the file.
    range: string

  workflow_link:
    title: Workflow Link
    description: Link to the workflow, code or command used to produce the file.
    range: uri

  workflow_parameters_description:
    title: Workflow Parameters Description
    description: >-
      Parameters and steps used to produce the file, such as filtering
      thresholds, normalization, dimensionality reduction and clustering
      settings.
    range: string

  matrix_type:
    title: Matrix Type
    description: Type of values stored in the matrix.
    range: MatrixTypeEnum

  cell_total:
    title: Cell Total
    description: Number of cells or nuclei that passed filtering.
    range: integer
    minimum_value: 0

  cell_barcode_tag:
    title: Cell Barcode Tag
    description: BAM tag holding the cell barcode (e.g. CB).
    range: string

  umi_tag:
    title: UMI Tag
    description: BAM tag holding the UMI (e.g. UB).
    range: string

  peak_calling_software:
    title: Peak Calling Software
    description: Software and version used to call peaks (e.g. MACS2 2.2.7.1).
    range: string
