  FileRatioUnitEnum:
    description: How to read the File Ratio.
    permissible_values:
      files_per_sample:
        title: "Files per sample"
        description: The File Ratio is the number of files for each sample, such as 2 for paired-end FASTQs.
      samples_per_file:
        title: "Samples per file"
        description: The File Ratio is the number of samples each file holds, for files that combine several samples, such as a count matrix.
      total_files:
        title: "Total files"
        description: The File Ratio is the total number of files, for data that isn't organized by sample, such as a model, code or a protocol.

